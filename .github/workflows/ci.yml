name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-check:
    name: 后端语法与静态检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP 语法检查
        run: |
          find app config -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan 静态检查（仅供参考，不阻塞）
        run: vendor/bin/phpstan analyse --memory-limit 300M
        continue-on-error: true

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 + 构建
        run: npm run build

  backend-tests:
    name: 后端单元测试（Swoole 环境）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 官方 Hyperf 镜像内运行 phpunit
        run: |
          set +e
          docker run --rm \
            -v "$PWD/backend:/opt/www" \
            -w /opt/www \
            --entrypoint sh \
            hyperf/hyperf:8.3-alpine-v3.19-swoole \
            -c "composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs && composer test" \
            > /tmp/ci-phpunit.log 2>&1
          CODE=$?
          echo "=== 末尾 30 行 ==="
          tail -n 30 /tmp/ci-phpunit.log
          echo "=== 错误关键字 ==="
          grep -nE 'error|Error|FAIL|Fatal|Exception|failed|not found|exit code' /tmp/ci-phpunit.log | tail -n 30
          MSG=$( { tail -n 30 /tmp/ci-phpunit.log; grep -nE 'error|Error|FAIL|Fatal|Exception|failed|not found|exit code' /tmp/ci-phpunit.log | tail -n 30; } | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' )
          echo "::error::$MSG"
          exit $CODE

  integration:
    name: Docker 集成验收（建表 + CRUD + 前端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建并启动全部服务
        run: docker compose up -d --build
      - name: 等待后端就绪
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9501/index/hello >/dev/null 2>&1; then
              echo "backend ready"
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:9501/index/hello
      - name: 验证数据库建表
        run: |
          docker compose exec -T mysql mysql -uiot -piot123456 iot_platform -e "SHOW TABLES;" | grep -q "device_data"
          docker compose exec -T mysql mysql -uiot -piot123456 iot_platform -e "DESCRIBE device_data;"
      - name: 接口验收（增删改查 + 参数校验 + 404）
        run: |
          # 新增
          CREATE=$(curl -fsS -X POST http://localhost:9501/device/data \
            -H 'Content-Type: application/json' \
            -d '{"device_id":"ci-dev001","temp":25.5,"humidity":60}')
          echo "create => $CREATE"
          ID=$(echo "$CREATE" | grep -o '"id":[0-9]*' | head -n1 | cut -d: -f2)
          test -n "$ID" && echo "id=$ID"

          # 列表（按设备筛选 + 分页）
          curl -fsS "http://localhost:9501/device/data?device_id=ci-dev001&page=1&page_size=5" | grep -q '"list"'
          curl -fsS "http://localhost:9501/device/data?device_id=ci-dev001&page=1&page_size=5" | grep -q '"total"'

          # 修改
          curl -fsS -X PUT "http://localhost:9501/device/data/$ID" \
            -H 'Content-Type: application/json' \
            -d '{"temp":26.8}' | grep -q "26.8"

          # 参数校验失败应返回 code 400
          curl -fsS -X POST http://localhost:9501/device/data \
            -H 'Content-Type: application/json' \
            -d '{}' | grep -q '"code":400'

          # 不存在的记录应返回 code 404
          curl -fsS -X DELETE http://localhost:9501/device/data/999999 | grep -q '"code":404'

          # 删除
          curl -fsS -X DELETE "http://localhost:9501/device/data/$ID" | grep -q '"code":200'

          # 统计接口（仪表盘）
          curl -fsS http://localhost:9501/device/stats | grep -q '"device_count"'

          echo "CRUD 验收通过"
      - name: 验证前端页面与 /api 代理
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          curl -fsS http://localhost:8080/api/device/data | grep -q '"code":200'
          echo "前端验收通过"
