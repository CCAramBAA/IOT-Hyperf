services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: iot_platform
      MYSQL_USER: iot
      MYSQL_PASSWORD: iot123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - iot-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: iot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis123456
    networks:
      - iot-network

  # Hyperf 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-backend
    restart: always
    ports:
      - "9501:9501"
    environment:
      - APP_ENV=dev
      - SCAN_CACHEABLE=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=iot_platform
      - DB_USERNAME=iot
      - DB_PASSWORD=iot123456
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=redis123456
      - JWT_SECRET=iot-platform-dev-secret-change-me
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - iot-network

  # Vue 前端（nginx 托管构建产物，并代理 /api 到后端）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iot-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - iot-network

volumes:
  mysql_data:
  redis_data:

networks:
  iot-network:
    driver: bridge
